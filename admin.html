<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Claudia Martins</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#171d21;color:#263238}.wrap{max-width:1050px;margin:auto;padding:32px 18px}.card{background:#f5f1e8;border-radius:18px;padding:28px;box-shadow:0 18px 50px #0005;margin-bottom:22px}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #aeb7ba;border-radius:9px;font:inherit}textarea{min-height:120px}.btn{border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;background:#385a55;color:#fff}.btn:disabled{opacity:.6;cursor:wait}.sec{background:#667579}.danger{background:#8a4b45}.actions,.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hidden{display:none}.status{min-height:22px;margin-top:12px;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center}.tab{background:#d9dfe1;color:#263238}.tab.active{background:#385a55;color:white}.item{background:white;border:1px solid #d4d9da;border-radius:12px;padding:16px;margin:10px 0}.item h3{margin:0 0 6px}.meta{font-size:13px;color:#68757b}.item p{white-space:pre-wrap}.login{max-width:480px;margin:7vh auto}.forgot{display:block;text-align:center;margin-top:14px;color:#385a55;font-weight:700;text-decoration:none;background:none;border:0;width:100%;cursor:pointer;font-size:14px}.forgot:hover{text-decoration:underline}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><section id="loginBox" class="card login"><h1>Área Administrativa</h1><p>Acesso restrito para administrar seu portfólio.</p><form id="loginForm"><p><label>E-mail</label><input id="email" type="email" required autocomplete="email"></p><p><label>Senha</label><input id="senha" type="password" required autocomplete="current-password"></p><button id="entrar" class="btn" type="submit">Entrar</button><button class="forgot" type="button" onclick="recuperarSenha()">Esqueci minha senha</button><div id="loginStatus" class="status" role="status"></div></form></section><section id="painel" class="hidden"><div class="card top"><div><h1>Painel do Portfólio</h1><div id="usuario" class="meta"></div></div><button id="sair" class="btn sec">Sair</button></div><div class="card"><div class="tabs"><button class="btn tab active" data-tipo="conhecimento">Conhecimentos</button><button class="btn tab" data-tipo="trajetoria">Trajetórias</button></div><h2 id="formTitulo">Adicionar conhecimento</h2><form id="conteudoForm"><div class="grid"><div><label>Título</label><input id="titulo" maxlength="150" required></div><div><label>Subtítulo / instituição</label><input id="subtitulo" maxlength="180"></div><div class="full"><label>Descrição</label><textarea id="descricao" maxlength="4000" required></textarea></div><div><label>Data inicial</label><input id="inicio" type="date"></div><div><label>Data final</label><input id="fim" type="date"></div></div><div class="actions"><button class="btn">Salvar</button><button class="btn sec hidden" id="cancelar" type="button">Cancelar edição</button></div><div id="formStatus" class="status"></div></form></div><div class="card"><h2 id="listaTitulo">Conhecimentos cadastrados</h2><div id="lista"></div></div></section></main><script>
const SB_URL='https://lpcpvqgiwvznxgltqqsu.supabase.co';
const SB_KEY='sb_publishable_UIuXQerbc_JIKUau4J7Jpw_L77U1-e3';
const $=id=>document.getElementById(id);
let sb=null,tipo='conhecimento',editId=null;
function mensagem(texto){$('loginStatus').textContent=texto;}
function iniciarSupabase(){try{if(!window.supabase||!window.supabase.createClient)throw new Error('Biblioteca de autenticação não carregou. Atualize a página.');sb=window.supabase.createClient(SB_URL,SB_KEY);return true}catch(e){mensagem('Erro ao iniciar o login: '+e.message);return false}}
async function mostrar(session){$('loginBox').classList.toggle('hidden',!!session);$('painel').classList.toggle('hidden',!session);if(session){$('usuario').textContent=session.user.email;await listar();}}
async function fazerLogin(e){e.preventDefault();const botao=$('entrar');mensagem('Entrando...');botao.disabled=true;try{if(!sb&&!iniciarSupabase())return;const email=$('email').value.trim();const password=$('senha').value;if(!email||!password){mensagem('Preencha e-mail e senha.');return;}const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw new Error('O Supabase não retornou uma sessão.');mensagem('Login realizado com sucesso.');await mostrar(data.session);}catch(e){console.error('Erro de login',e);mensagem('Não foi possível entrar: '+(e.message||'erro desconhecido'));}finally{botao.disabled=false;}}
async function recuperarSenha(){const email=$('email').value.trim();if(!email){mensagem('Digite seu e-mail no campo acima.');$('email').focus();return;}mensagem('Enviando e-mail de recuperação...');try{const r=await fetch(SB_URL+'/auth/v1/recover?redirect_to='+encodeURIComponent('https://claubologna-max.github.io/Claudia-backup/reset-password.html'),{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({email})});const body=await r.text();if(!r.ok)throw new Error(body||('HTTP '+r.status));mensagem('Solicitação enviada. Verifique seu e-mail e também a caixa de spam.');}catch(e){mensagem('Erro ao solicitar recuperação: '+e.message);}}
function limpar(){$('conteudoForm').reset();editId=null;$('cancelar').classList.add('hidden');}
async function listar(){if(!sb)return;const {data,error}=await sb.from('portfolio_conteudos').select('*').eq('tipo',tipo).order('ordem').order('criado_em',{ascending:false});if(error){$('lista').textContent='Não foi possível carregar os dados: '+error.message;return;}$('lista').innerHTML='';if(!data.length){$('lista').textContent='Nenhum item cadastrado.';return;}data.forEach(x=>{const d=document.createElement('div');d.className='item';const h=document.createElement('h3');h.textContent=x.titulo;const m=document.createElement('div');m.className='meta';m.textContent=[x.subtitulo,x.data_inicio,x.data_fim].filter(Boolean).join(' • ');const p=document.createElement('p');p.textContent=x.descricao;const a=document.createElement('div');a.className='actions';const ed=document.createElement('button');ed.className='btn sec';ed.type='button';ed.textContent='Editar';ed.onclick=()=>{editId=x.id;$('titulo').value=x.titulo;$('subtitulo').value=x.subtitulo||'';$('descricao').value=x.descricao;$('inicio').value=x.data_inicio||'';$('fim').value=x.data_fim||'';$('cancelar').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'});};const del=document.createElement('button');del.className='btn danger';del.type='button';del.textContent='Excluir';del.onclick=async()=>{if(confirm('Excluir este item?')){const {error}=await sb.from('portfolio_conteudos').delete().eq('id',x.id);if(error)alert(error.message);else listar();}};a.append(ed,del);d.append(h,m,p,a);$('lista').append(d);});}
$('loginForm').addEventListener('submit',fazerLogin);
$('sair').onclick=async()=>{if(sb)await sb.auth.signOut();mostrar(null);};
$('cancelar').onclick=limpar;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tipo=b.dataset.tipo;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('formTitulo').textContent=tipo==='conhecimento'?'Adicionar conhecimento':'Adicionar trajetória';$('listaTitulo').textContent=tipo==='conhecimento'?'Conhecimentos cadastrados':'Trajetórias cadastradas';limpar();listar();});
$('conteudoForm').onsubmit=async e=>{e.preventDefault();$('formStatus').textContent='Salvando...';try{const p={tipo,titulo:$('titulo').value.trim(),subtitulo:$('subtitulo').value.trim()||null,descricao:$('descricao').value.trim(),data_inicio:$('inicio').value||null,data_fim:$('fim').value||null};const {error}=editId?await sb.from('portfolio_conteudos').update(p).eq('id',editId):await sb.from('portfolio_conteudos').insert(p);if(error)throw error;$('formStatus').textContent='Salvo com sucesso.';limpar();await listar();}catch(e){$('formStatus').textContent='Não foi possível salvar: '+e.message;}};
(async()=>{if(!iniciarSupabase())return;try{const {data,error}=await sb.auth.getSession();if(error)throw error;await mostrar(data.session);}catch(e){mensagem('Erro ao verificar sessão: '+e.message);}})();
</script></body></html>
