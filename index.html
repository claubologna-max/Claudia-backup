<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claudia Martins | Especialista de TI e CX</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#171d21}body{display:flex;justify-content:center;font-family:Arial,sans-serif}.portfolio{position:relative;width:min(100%,1312px);margin:0 auto}.portfolio>img{display:block;width:100%;height:auto}.link{position:absolute;display:block;z-index:2;cursor:pointer}.hero-contact{left:14.3%;top:25.8%;width:9.1%;height:3.1%}.email{left:36%;top:82%;width:27%;height:3.5%}.linkedin{left:36%;top:85%;width:30%;height:3.5%}.bottom-contact{left:36.2%;top:93%;width:11.7%;height:3.3%}.admin-knowledge{position:absolute;z-index:5;left:17.8%;top:47.15%;width:45%;display:none;color:#fff}.admin-knowledge.show{display:block}.knowledge-row{position:relative;padding-left:7.2%;min-height:42px;text-shadow:0 1px 2px #000}.knowledge-row:before{content:'✦';position:absolute;left:0;top:0;width:5.5%;height:100%;display:flex;align-items:flex-start;justify-content:center;font-size:clamp(11px,1.25vw,17px);color:#eef2ef}.knowledge-row strong{display:block;font-size:clamp(9px,1.05vw,15px);line-height:1.18;margin-bottom:2px}.knowledge-row span{display:block;font-size:clamp(8px,.86vw,12px);line-height:1.2;color:#e2e7e5}.modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.68);align-items:center;justify-content:center;padding:20px}.modal.aberto{display:flex}.card{box-sizing:border-box;width:min(92vw,520px);background:#f5f1e8;color:#20282d;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}.card h2{margin:0 0 8px}.card>p{margin:0 0 20px;color:#59656c}.fechar{float:right;border:0;background:transparent;font-size:26px;cursor:pointer;color:#48545a}.campo{margin-bottom:15px}.campo label{display:block;font-weight:700;margin-bottom:6px}.campo input,.campo textarea{box-sizing:border-box;width:100%;border:1px solid #aeb7ba;border-radius:9px;padding:12px;font:inherit;background:#fff}.campo textarea{min-height:120px;resize:vertical}.acoes{display:flex;gap:10px;justify-content:flex-end}.btn{border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}.cancelar{background:#d9dfe1;color:#273238}.enviar{background:#385a55;color:#fff}.enviar:disabled{opacity:.55;cursor:wait}.status{min-height:22px;margin:12px 0 0!important;font-size:14px}@media(max-width:700px){.card{padding:22px}.admin-knowledge{left:17.8%;top:47.15%;width:48%}.knowledge-row{padding-left:7%}}
</style></head><body><main class="portfolio"><img src="portfolio-final.jpg" alt="Portfólio profissional de Claudia Martins — Especialista de TI e CX"><a class="link hero-contact abrir-contato" href="#contato" aria-label="Entrar em contato com Claudia Martins"></a><a class="link email" href="mailto:claubologna@hotmail.com" aria-label="Enviar e-mail para Claudia Martins"></a><a class="link linkedin" href="https://www.linkedin.com/in/claudia-m-9b5278192/" target="_blank" rel="noopener" aria-label="LinkedIn de Claudia Martins"></a><a class="link bottom-contact abrir-contato" href="#contato" aria-label="Entrar em contato com Claudia Martins"></a><div id="adminKnowledge" class="admin-knowledge" aria-live="polite"></div></main>
<div class="modal" id="contato" role="dialog" aria-modal="true" aria-labelledby="tituloContato"><div class="card"><button class="fechar" id="fecharContato" type="button" aria-label="Fechar">×</button><h2 id="tituloContato">Entre em contato</h2><p>Preencha os dados abaixo e sua mensagem ficará registrada para retorno.</p><form id="formContato"><div class="campo"><label for="nome">Nome</label><input id="nome" name="nome" maxlength="120" required autocomplete="name"></div><div class="campo"><label for="emailContato">E-mail</label><input id="emailContato" name="email" type="email" maxlength="254" required autocomplete="email"></div><div class="campo"><label for="motivo">Motivo do contato</label><textarea id="motivo" name="motivo" maxlength="2000" required></textarea></div><div class="acoes"><button class="btn cancelar" id="cancelarContato" type="button">Cancelar</button><button class="btn enviar" id="enviarContato" type="submit">Enviar</button></div><p class="status" id="statusContato" role="status" aria-live="polite"></p></form></div></div>
<script>
const SUPABASE_URL='https://lpcpvqgiwvznxgltqqsu.supabase.co',SUPABASE_KEY='sb_publishable_UIuXQerbc_JIKUau4J7Jpw_L77U1-e3';const modal=document.getElementById('contato'),form=document.getElementById('formContato'),statusEl=document.getElementById('statusContato'),enviar=document.getElementById('enviarContato');function abrir(e){e.preventDefault();statusEl.textContent='';modal.classList.add('aberto');document.getElementById('nome').focus()}function fechar(){modal.classList.remove('aberto')}document.querySelectorAll('.abrir-contato').forEach(el=>el.addEventListener('click',abrir));document.getElementById('fecharContato').addEventListener('click',fechar);document.getElementById('cancelarContato').addEventListener('click',fechar);modal.addEventListener('click',e=>{if(e.target===modal)fechar()});document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});form.addEventListener('submit',async e=>{e.preventDefault();enviar.disabled=true;statusEl.textContent='Enviando...';const payload={nome:form.nome.value.trim(),email:form.email.value.trim(),motivo:form.motivo.value.trim()};try{const r=await fetch(`${SUPABASE_URL}/rest/v1/contatos`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());form.reset();statusEl.textContent='Mensagem enviada com sucesso! Obrigada pelo contato.';setTimeout(fechar,2200)}catch(err){statusEl.textContent='Não foi possível enviar a mensagem. Tente novamente.'}finally{enviar.disabled=false}});
async function carregarConhecimento(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/portfolio_conteudos?tipo=eq.conhecimento&select=*&order=ordem.asc,criado_em.desc&limit=1`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!r.ok)return;const dados=await r.json();if(!dados.length)return;const x=dados[0],box=document.getElementById('adminKnowledge');box.innerHTML='';const row=document.createElement('div');row.className='knowledge-row';const titulo=document.createElement('strong');titulo.textContent=x.titulo;const desc=document.createElement('span');desc.textContent=x.descricao;row.append(titulo,desc);box.append(row);box.classList.add('show')}catch(e){console.error(e)}}carregarConhecimento();
</script></body></html>
