<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claudia Martins | Especialista de TI e CX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#171d21}body{font-family:Arial,sans-serif;color:#263238}.portfolio{position:relative;width:min(100%,1312px);margin:0 auto}.portfolio img{display:block;width:100%;height:auto}.link{position:absolute;display:block;z-index:2;cursor:pointer}.hero-contact{left:14.3%;top:25.8%;width:9.1%;height:3.1%}.email{left:36%;top:82%;width:27%;height:3.5%}.linkedin{left:36%;top:85%;width:30%;height:3.5%}.bottom-contact{left:36.2%;top:93%;width:11.7%;height:3.3%}.conteudos{width:min(calc(100% - 36px),1120px);margin:34px auto 60px;background:#f5f1e8;border-radius:20px;padding:32px;box-shadow:0 18px 50px #0005}.conteudos h2{margin:0 0 8px;font-size:28px}.conteudos .intro{margin:0 0 24px;color:#667579}.secao{margin-top:30px}.secao h3{font-size:22px;margin:0 0 14px;color:#385a55}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.item{background:#fff;border:1px solid #d4d9da;border-radius:14px;padding:18px}.item h4{margin:0 0 7px;font-size:18px}.meta{font-size:13px;color:#68757b;margin-bottom:10px}.item p{margin:0;white-space:pre-wrap;line-height:1.5}.vazio{color:#68757b}.modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.68);align-items:center;justify-content:center;padding:20px}.modal.aberto{display:flex}.card{width:min(92vw,520px);background:#f5f1e8;color:#20282d;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}.card h2{margin:0 0 8px}.card>p{margin:0 0 20px;color:#59656c}.fechar{float:right;border:0;background:transparent;font-size:26px;cursor:pointer;color:#48545a}.campo{margin-bottom:15px}.campo label{display:block;font-weight:700;margin-bottom:6px}.campo input,.campo textarea{width:100%;border:1px solid #aeb7ba;border-radius:9px;padding:12px;font:inherit;background:#fff}.campo textarea{min-height:120px;resize:vertical}.acoes{display:flex;gap:10px;justify-content:flex-end}.btn{border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}.cancelar{background:#d9dfe1;color:#273238}.enviar{background:#385a55;color:#fff}.enviar:disabled{opacity:.55;cursor:wait}.status{min-height:22px;margin:12px 0 0!important;font-size:14px}@media(max-width:700px){.portfolio{width:100%}.card,.conteudos{padding:22px}.conteudos{margin-top:20px}.conteudos h2{font-size:24px}}
</style>
</head>
<body>
<main class="portfolio">
<img src="portfolio-final.jpg" alt="Portfólio profissional de Claudia Martins — Especialista de TI e CX">
<a class="link hero-contact abrir-contato" href="#contato" aria-label="Entrar em contato com Claudia Martins"></a>
<a class="link email" href="mailto:claubologna@hotmail.com" aria-label="Enviar e-mail para Claudia Martins"></a>
<a class="link linkedin" href="https://www.linkedin.com/in/claudia-m-9b5278192/" target="_blank" rel="noopener" aria-label="LinkedIn de Claudia Martins"></a>
<a class="link bottom-contact abrir-contato" href="#contato" aria-label="Entrar em contato com Claudia Martins"></a>
</main>
<section class="conteudos" id="conteudos"><h2>Conhecimentos e Trajetória</h2><p class="intro">Conteúdos atualizados pela área administrativa do portfólio.</p><div class="secao"><h3>Conhecimentos</h3><div id="conhecimentos" class="cards"><p class="vazio">Carregando...</p></div></div><div class="secao"><h3>Trajetórias</h3><div id="trajetorias" class="cards"><p class="vazio">Carregando...</p></div></div></section>
<div class="modal" id="contato" role="dialog" aria-modal="true" aria-labelledby="tituloContato"><div class="card"><button class="fechar" id="fecharContato" type="button" aria-label="Fechar">×</button><h2 id="tituloContato">Entre em contato</h2><p>Preencha os dados abaixo e sua mensagem ficará registrada para retorno.</p><form id="formContato"><div class="campo"><label for="nome">Nome</label><input id="nome" name="nome" maxlength="120" required autocomplete="name"></div><div class="campo"><label for="emailContato">E-mail</label><input id="emailContato" name="email" type="email" maxlength="254" required autocomplete="email"></div><div class="campo"><label for="motivo">Motivo do contato</label><textarea id="motivo" name="motivo" maxlength="2000" required></textarea></div><div class="acoes"><button class="btn cancelar" id="cancelarContato" type="button">Cancelar</button><button class="btn enviar" id="enviarContato" type="submit">Enviar</button></div><p class="status" id="statusContato" role="status" aria-live="polite"></p></form></div></div>
<script>
const SUPABASE_URL='https://lpcpvqgiwvznxgltqqsu.supabase.co';
const SUPABASE_KEY='sb_publishable_UIuXQerbc_JIKUau4J7Jpw_L77U1-e3';
const modal=document.getElementById('contato'),form=document.getElementById('formContato'),statusEl=document.getElementById('statusContato'),enviar=document.getElementById('enviarContato');
function abrir(e){e.preventDefault();statusEl.textContent='';modal.classList.add('aberto');document.getElementById('nome').focus()}function fechar(){modal.classList.remove('aberto')}
document.querySelectorAll('.abrir-contato').forEach(el=>el.addEventListener('click',abrir));document.getElementById('fecharContato').addEventListener('click',fechar);document.getElementById('cancelarContato').addEventListener('click',fechar);modal.addEventListener('click',e=>{if(e.target===modal)fechar()});document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
form.addEventListener('submit',async e=>{e.preventDefault();enviar.disabled=true;statusEl.textContent='Enviando...';const payload={nome:form.nome.value.trim(),email:form.email.value.trim(),motivo:form.motivo.value.trim()};try{const r=await fetch(`${SUPABASE_URL}/rest/v1/contatos`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());form.reset();statusEl.textContent='Mensagem enviada com sucesso! Obrigada pelo contato.';setTimeout(fechar,2200)}catch(err){console.error(err);statusEl.textContent='Não foi possível enviar a mensagem. Tente novamente.'}finally{enviar.disabled=false}});
function dataBR(v){if(!v)return'';const [a,m,d]=v.split('-');return `${d}/${m}/${a}`}
function render(lista,id){const box=document.getElementById(id);box.innerHTML='';if(!lista.length){box.innerHTML='<p class="vazio">Nenhum conteúdo cadastrado.</p>';return}lista.forEach(x=>{const el=document.createElement('article');el.className='item';const h=document.createElement('h4');h.textContent=x.titulo;const meta=document.createElement('div');meta.className='meta';const periodo=[dataBR(x.data_inicio),dataBR(x.data_fim)].filter(Boolean).join(' a ');meta.textContent=[x.subtitulo,periodo].filter(Boolean).join(' • ');const p=document.createElement('p');p.textContent=x.descricao;el.append(h);if(meta.textContent)el.append(meta);el.append(p);box.append(el)})}
async function carregarConteudos(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/portfolio_conteudos?select=*&order=ordem.asc,criado_em.desc`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});if(!r.ok)throw new Error(await r.text());const dados=await r.json();render(dados.filter(x=>x.tipo==='conhecimento'),'conhecimentos');render(dados.filter(x=>x.tipo==='trajetoria'),'trajetorias')}catch(e){console.error(e);document.getElementById('conhecimentos').innerHTML='<p class="vazio">Não foi possível carregar os conteúdos.</p>';document.getElementById('trajetorias').innerHTML='<p class="vazio">Não foi possível carregar os conteúdos.</p>'}}
carregarConteudos();
</script>
</body>
</html>
