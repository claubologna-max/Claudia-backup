<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha | Claudia Martins</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#171d21;font-family:Arial,sans-serif;color:#263238}.card{width:min(460px,100%);background:#f5f1e8;border-radius:18px;padding:28px;box-shadow:0 18px 50px #0005}h1{margin-top:0;color:#385a55}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #aeb7ba;border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:9px;padding:12px 18px;margin-top:18px;font-weight:700;cursor:pointer;background:#385a55;color:#fff}.status{min-height:22px;margin-top:14px}.help{color:#68757b;font-size:14px}</style></head><body><main class="card"><h1>Criar nova senha</h1><p class="help">Digite sua nova senha duas vezes para confirmar.</p><form id="form"><label for="senha">Nova senha</label><input id="senha" type="password" minlength="8" required autocomplete="new-password"><label for="confirmar">Confirmar nova senha</label><input id="confirmar" type="password" minlength="8" required autocomplete="new-password"><button class="btn" type="submit">Salvar nova senha</button><p id="status" class="status" role="status"></p></form></main><script>const SB_URL='https://lpcpvqgiwvznxgltqqsu.supabase.co';const SB_KEY='sb_publishable_UIuXQerbc_JIKUau4J7Jpw_L77U1-e3';const sb=supabase.createClient(SB_URL,SB_KEY);const form=document.getElementById('form'),statusEl=document.getElementById('status');let recovery=false;sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')recovery=true});form.addEventListener('submit',async e=>{e.preventDefault();const senha=document.getElementById('senha').value,confirmar=document.getElementById('confirmar').value;if(senha!==confirmar){statusEl.textContent='As senhas não são iguais.';return}if(senha.length<8){statusEl.textContent='Use pelo menos 8 caracteres.';return}statusEl.textContent='Salvando nova senha...';const{data:{session}}=await sb.auth.getSession();if(!session&&!recovery){statusEl.textContent='Este link não é válido ou expirou. Solicite um novo e-mail de recuperação.';return}const{error}=await sb.auth.updateUser({password:senha});if(error){statusEl.textContent='Não foi possível alterar a senha: '+error.message;return}statusEl.textContent='Senha alterada com sucesso. Redirecionando para o login...';await sb.auth.signOut();setTimeout(()=>location.href='./admin.html',1800)});</script></body></html>
