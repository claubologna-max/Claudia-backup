<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha | Claudia Martins</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#171d21;font-family:Arial,sans-serif;color:#263238}.card{width:min(460px,100%);background:#f5f1e8;border-radius:18px;padding:28px;box-shadow:0 18px 50px #0005}h1{margin-top:0;color:#385a55}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #aeb7ba;border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:9px;padding:12px 18px;margin-top:18px;font-weight:700;cursor:pointer;background:#385a55;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.status{min-height:22px;margin-top:14px}.help{color:#68757b;font-size:14px}.ok{color:#285b42}.erro{color:#8a3030}</style></head><body><main class="card"><h1>Criar nova senha</h1><p class="help" id="help">Validando seu link de recuperação...</p><form id="form"><label for="senha">Nova senha</label><input id="senha" type="password" minlength="8" required autocomplete="new-password" disabled><label for="confirmar">Confirmar nova senha</label><input id="confirmar" type="password" minlength="8" required autocomplete="new-password" disabled><button id="salvar" class="btn" type="submit" disabled>Salvar nova senha</button><p id="status" class="status" role="status"></p></form></main><script>const SB_URL='https://lpcpvqgiwvznxgltqqsu.supabase.co';const SB_KEY='sb_publishable_UIuXQerbc_JIKUau4J7Jpw_L77U1-e3';const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{detectSessionInUrl:true,persistSession:true}});const form=document.getElementById('form'),statusEl=document.getElementById('status'),help=document.getElementById('help'),senhaEl=document.getElementById('senha'),confirmarEl=document.getElementById('confirmar'),salvar=document.getElementById('salvar');let pronto=false;function liberar(){pronto=true;senhaEl.disabled=false;confirmarEl.disabled=false;salvar.disabled=false;help.textContent='Link validado. Digite sua nova senha duas vezes para confirmar.';statusEl.textContent='';senhaEl.focus()}function falhar(msg){pronto=false;senhaEl.disabled=true;confirmarEl.disabled=true;salvar.disabled=true;help.textContent='Não foi possível validar este link.';statusEl.className='status erro';statusEl.textContent=msg}async function iniciar(){try{const query=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.replace(/^#/,''));const erro=query.get('error_description')||hash.get('error_description');if(erro){falhar(decodeURIComponent(erro.replace(/\+/g,' ')));return}const code=query.get('code');if(code){const{error}=await sb.auth.exchangeCodeForSession(code);if(error){falhar('O link de recuperação é inválido ou expirou. Solicite um novo e-mail.');return}}const{data,error}=await sb.auth.getSession();if(error){falhar('Não foi possível validar sua sessão de recuperação. Solicite um novo e-mail.');return}if(data.session){liberar();return}setTimeout(async()=>{const{data:segunda}=await sb.auth.getSession();if(segunda.session)liberar();else falhar('O link de recuperação é inválido ou expirou. Volte ao login e solicite um novo e-mail.')},1200)}catch(e){falhar('Erro ao validar o link. Volte ao login e solicite um novo e-mail.')}}sb.auth.onAuthStateChange((event,session)=>{if((event==='PASSWORD_RECOVERY'||event==='SIGNED_IN')&&session)liberar()});iniciar();form.addEventListener('submit',async e=>{e.preventDefault();if(!pronto){falhar('A sessão de recuperação não está disponível. Solicite um novo e-mail.');return}const senha=senhaEl.value,confirmar=confirmarEl.value;if(senha!==confirmar){statusEl.className='status erro';statusEl.textContent='As senhas não são iguais.';return}if(senha.length<8){statusEl.className='status erro';statusEl.textContent='Use pelo menos 8 caracteres.';return}salvar.disabled=true;statusEl.className='status';statusEl.textContent='Salvando nova senha...';const{error}=await sb.auth.updateUser({password:senha});if(error){salvar.disabled=false;statusEl.className='status erro';statusEl.textContent='Não foi possível alterar a senha: '+error.message;return}statusEl.className='status ok';statusEl.textContent='Senha alterada com sucesso. Voltando para o login...';setTimeout(async()=>{await sb.auth.signOut();location.replace('./admin.html?senha=alterada')},1200)});</script></body></html>
